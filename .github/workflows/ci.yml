name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  IMAGEKIT_ENABLED: false
  DATABASE_ENABLED: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run lint
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-diagnostics
          npm run lint 2>&1 | tee ci-diagnostics/lint.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-diagnostics
          path: |
            ci-diagnostics/
            junit.xml
          retention-days: 7
          if-no-files-found: ignore

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run format
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-diagnostics
          npm run format:check 2>&1 | tee ci-diagnostics/format.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: format-diagnostics
          path: |
            ci-diagnostics/
            junit.xml
          retention-days: 7
          if-no-files-found: ignore

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run typecheck
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-diagnostics
          npm run typecheck 2>&1 | tee ci-diagnostics/typecheck.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-diagnostics
          path: |
            ci-diagnostics/
            junit.xml
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-diagnostics
          npm test -- --reporter=default --reporter=junit --outputFile=junit.xml 2>&1 | tee ci-diagnostics/test.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          path: |
            ci-diagnostics/
            junit.xml
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-diagnostics
          npm run build 2>&1 | tee ci-diagnostics/build.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diagnostics
          path: |
            ci-diagnostics/
            junit.xml
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: workflow and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          cache: false
      - name: Install pinned security tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Lint workflows
        run: actionlint -color
      - name: Scan full git history for secrets
        # Redact every finding. Never upload a report containing credentials.
        # Scan all branches/history available at this revision, including
        # secrets added and then removed within a pull request.
        run: gitleaks git --redact=100 --no-banner --log-opts="--all"

  dependencies:
    name: dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true

  required:
    name: CI required
    if: ${{ always() }}
    needs: [lint, format, typecheck, test, build, security, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          EVENT: ${{ github.event_name }}
        run: |
          for check in LINT FORMAT TYPECHECK TEST BUILD SECURITY; do
            variable="${check}_RESULT"
            result="${!variable:-}"
            if [[ "$result" != "success" ]]; then
              echo "Required validation did not succeed: $check ($result)"
              exit 1
            fi
          done
          if [[ "$EVENT" == "pull_request" ]]; then
            [[ "$DEPENDENCIES_RESULT" == "success" ]] || exit 1
          elif [[ "$EVENT" == "push" || "$EVENT" == "workflow_dispatch" || "$EVENT" == "merge_group" ]]; then
            [[ "$DEPENDENCIES_RESULT" == "skipped" ]] || exit 1
          else
            echo "Unexpected CI event."
            exit 1
          fi
          echo "Every required validation job succeeded."
